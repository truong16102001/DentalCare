<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo.png}">
    <title>Lịch khám</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/fonts/themify-icons/themify-icons.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/themify-icons/1.0.1/css/themify-icons.css">
    <link rel="stylesheet" th:href="@{/css/style1.css}">
    <link rel="stylesheet" th:href="@{/css/style2.css}">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js"></script>
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"/>

    <!-- Include JavaScript component -->
    <th:block th:replace="component/javascript :: javascript"></th:block>

    <style>
        li.nav-item a.active{
            color: red;
            font-weight: bold;
        }
        li.nav-item a{
            color: black;
        }
        .form-select option{
            background-color: transparent;
        }

        .input-container {
            position: relative;
            display: inline-block;
        }

        .input-container input[type="text"] {
            padding-right: 30px;
        }

        .clear-icon {
            position: absolute;
            top: 50%;
            color: red;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            display: none;
        }

        .input-container:hover .clear-icon {
            display: block;
        }

        .product-item {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(0 0 0);
            text-align: center;
        }

        .product-thumb {
            width: 180px;
            height: 250px;
        }

        .product-name {
            /* You can adjust the font size as needed */
            font-size: 14px;
            /* You can add additional styles if needed */
        }
    </style>
</head>
<body>

<div id="main">
    <!-- Header -->
    <th:block th:replace="component/header :: header"></th:block>

    <div class="container-fluid" style="margin-top: 100px">
        <div th:if="${notification != null}"
             th:classappend="${#strings.contains(notification.toLowerCase(), 'thành công')} ? 'alert alert-success' : 'alert alert-danger'"
             class="alert alert-dismissible fade show"
             role="alert"
             style="position: fixed; z-index: 15; margin-left: 80%; margin-top: -40%;">
            <strong th:text="${notification}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="row">
            <h1 style="text-align: center;">Lịch khám</h1>

            <th:block th:replace="component/leftBoard :: leftBoard"></th:block>

            <div class="col-md-10">
                <div class="row justify-content-between">
                    <div class="col-md-4">
                        <form class="search-bar" id="dateForm" th:action="@{/doctor-schedule}" method="get">
                            <div class="input-container">
                                <label for="date"><b>Chọn ngày: </b></label>
                                <input id="date" class="form-control" type="date" name="date"
                                       th:value="${date}" required onchange="document.getElementById('dateForm').submit()" />
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row" style="margin-top:40px;">
                    <div class="container mtop" style="width:100%">
                        <table class="table table-striped table-bordered" id="sortTable">
                            <thead class="table-dark">
                            <tr>
                                <th>Phòng</th>
                                <th th:each="slot : ${slots}"
                                    th:text="${slot.startTime + '-' + slot.endTime }">
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="room : ${rooms}">
                                <td th:text="${room.roomId + '_' + room.roomName}"></td>
                                <td th:each="slot : ${slots}" th:with="key=${room.roomId + '_' + slot.slotId}">
                  <span th:if="${sessionMap.get(key) != null}"
                        th:text="${sessionMap.get(key).status}">
                  </span>
                <span th:if="${sessionMap.get(key) != null}">
                   <a type="button"
                      th:href="@{/schedule-details(sessionId=${sessionMap.get(key).sessionId})}"
                      class="btn btn-primary btn-sm"
                      >
                      Chi tiết
                    </a>
                </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- jQuery (required for DataTables) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script>
    if (document.querySelector('.alert')) {
        document.querySelectorAll('.alert').forEach(function ($el) {
            setTimeout(() => {
                $el.classList.remove('show');
            }, 3000);
        });
    }
</script>

</body>
</html>
